:root { --teal:#0F5C63; --peach:#F2A9A0; --mint:#BFE3E0; --cream:#FFF9F2; }

#shadow { position:absolute; left:70px; bottom:-28px; width:500px; height:60px; border-radius:50%; background:rgba(15,92,99,.18); }
#catHop { position:absolute; inset:0; }
#cat { position:absolute; inset:0; width:640px; height:586px; -webkit-mask-image:linear-gradient(to right,transparent 0,#000 9%); mask-image:linear-gradient(to right,transparent 0,#000 9%); }
.heart { position:absolute; width:70px; height:64px; opacity:0; }
.txt { position:absolute; left:0; width:1080px; top:1440px; text-align:center; direction:rtl; }
.big { display:inline-block; color:var(--teal); font-size:150px; font-weight:800; line-height:1.1; }
#pill { display:inline-block; background:var(--teal); color:#fff; font-size:92px; font-weight:800; padding:10px 70px 24px; border-radius:90px; box-shadow:0 12px 0 #A9D9D6; }
#hours { display:block; margin-top:40px; color:var(--teal); font-size:96px; font-weight:800; }

<script>
const tl = gsap.timeline({ paused: true });
const C = "#catWrap", H = "#catHop", K = "#cat", L = "#logoBox";
// intro: logo pops
tl.set(C, { x: -900 }, 0)
  .from(L, { scale: 0.55, rotation: -40, duration: 0.8, ease: "back.out(1.8)" }, 0)
  .to("#ring", { rotation: 360, duration: 15, ease: "none" }, 0)
  .fromTo(".star", { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.4, stagger: 0.07, ease: "back.out(3)" }, 0.45)
  .to(".star", { rotation: 180, scale: 0.7, duration: 7, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0.9);
// walk in with 5 hops (landings at 1.25,1.7,2.15,2.6,3.05)
tl.to(C, { x: 0, duration: 2.25, ease: "power1.out" }, 0.8);
[0.8,1.25,1.7,2.15,2.6].forEach((s,i) => {
  tl.to(H, { y: -70, duration: 0.2, ease: "power2.out" }, s)
    .to(H, { y: 0, duration: 0.25, ease: "power2.in" }, s + 0.2)
    .to(K, { rotation: i%2 ? 4 : -4, duration: 0.45, ease: "sine.inOut" }, s)
    .to(K, { scaleY: 0.9, scaleX: 1.06, transformOrigin: "50% 100%", duration: 0.08 }, s + 0.45)
    .to(K, { scaleY: 1, scaleX: 1, duration: 0.18, ease: "back.out(3)" }, s + 0.53);
});
tl.to(K, { rotation: 0, duration: 0.2 }, 3.05);
// play: big jump toward logo, bat it
tl.to(H, { y: -170, duration: 0.3, ease: "power2.out" }, 3.25)
  .to(K, { rotation: -10, duration: 0.3 }, 3.25)
  .to(L, { rotation: 25, y: -30, duration: 0.18, ease: "power2.out" }, 3.55)
  .to(L, { rotation: 0, y: 0, duration: 0.6, ease: "elastic.out(1.2,0.3)" }, 3.73)
  .to(H, { y: 0, duration: 0.4, ease: "bounce.out" }, 3.55)
  .to(K, { rotation: 0, duration: 0.3 }, 3.6)
  .to(H, { y: -90, duration: 0.25, ease: "power2.out" }, 4.1)
  .to(K, { rotation: 8, duration: 0.25 }, 4.1)
  .to(L, { rotation: -18, scale: 1.06, duration: 0.15 }, 4.35)
  .to(L, { rotation: 0, scale: 1, duration: 0.8, ease: "elastic.out(1.2,0.3)" }, 4.5)
  .to(H, { y: 0, duration: 0.35, ease: "bounce.out" }, 4.35)
  .to(K, { rotation: 0, duration: 0.3 }, 4.4)
  .to("#shadow", { scaleX: 0.7, opacity: 0.5, duration: 0.3, yoyo: true, repeat: 1 }, 3.25)
  .to("#shadow", { scaleX: 0.8, duration: 0.25, yoyo: true, repeat: 1 }, 4.1);
// idle breathing + head tilt
tl.to(K, { scaleY: 1.02, transformOrigin: "50% 100%", duration: 1, ease: "sine.inOut", yoyo: true, repeat: 9 }, 5)
  .to(K, { rotation: -3, transformOrigin: "50% 100%", duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 5 }, 5.2)
  .to(L, { y: -14, duration: 1.4, ease: "sine.inOut", yoyo: true, repeat: 5 }, 5.4);
// heart bursts
function burst(g, t, cx, cy, r) {
  const hs = gsap.utils.toArray(".h" + g);
  hs.forEach((h, i) => {
    const a = (i / hs.length) * Math.PI * 2 + 0.3;
    const ex = cx - 35 + Math.cos(a) * r, ey = cy - 32 + Math.sin(a) * r * 0.85;
    tl.set(h, { x: cx - 35, y: cy - 32, scale: 0.2, opacity: 1 }, t)
      .to(h, { x: ex, y: ey, scale: 0.8 + (i % 3) * 0.25, rotation: (i % 2 ? 1 : -1) * 25, duration: 0.8, ease: "power3.out" }, t)
      .to(h, { opacity: 0, y: ey - 60, duration: 0.5 }, t + 0.8);
  });
}
burst(1, 3.58, 540, 500, 360);
burst(2, 13.45, 540, 1000, 430);
// texts
tl.from("#t1s", { y: 120, scale: 0.6, opacity: 0, duration: 0.5, ease: "back.out(2)" }, 5)
  .to("#t1s", { y: -40, opacity: 0, duration: 0.25 }, 6.3)
  .from("#t2s", { y: 120, scale: 0.6, opacity: 0, duration: 0.5, ease: "back.out(2)" }, 6.6)
  .to("#t2s", { y: -40, opacity: 0, duration: 0.25 }, 8.6)
  .from("#pill", { scale: 0, duration: 0.55, ease: "back.out(2.2)" }, 8.95)
  .from("#hours", { y: 60, opacity: 0, duration: 0.5, ease: "power3.out" }, 9.3)
  .to("#pill", { scale: 1.06, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 3 }, 10.4)
  .to(L, { scale: 1.08, duration: 0.25, yoyo: true, repeat: 1 }, 13.45)
  .to(H, { y: -60, duration: 0.2, yoyo: true, repeat: 1, ease: "power2.out" }, 13.4);
window.__timelines["main"] = tl;
</script>
