<title>Alf3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600;700&display=swap">
<style>
/* Layout: 2x2 grid of stock tiles (F G H O); each tile has a small + for stock and an "Out today" field that deducts automatically. */
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface-2:#f4f7f5; --line:#d9e2dd;
  --fg:#15201b; --muted:#5d6b64;
  --accent:#0d7556; --accent-fg:#ffffff; --accent-soft:#dcefe7;
  --out:#b8430f; --out-soft:#fbe6da;
  --warn:#a86b00; --warn-soft:#fbefd2;
  --empty:#b42318; --empty-soft:#fbe0dd;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.06);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1513; --surface:#18201d; --surface-2:#1f2925; --line:#2c3934;
  --fg:#e8efec; --muted:#9aaba3;
  --accent:#3fbf8f; --accent-fg:#06130e; --accent-soft:#163a2d;
  --out:#f08a55; --out-soft:#3a2117;
  --warn:#e8b34a; --warn-soft:#3a2e14;
  --empty:#f2766b; --empty-soft:#3d1a17;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f1513; --surface:#18201d; --surface-2:#1f2925; --line:#2c3934;
  --fg:#e8efec; --muted:#9aaba3;
  --accent:#3fbf8f; --accent-fg:#06130e; --accent-soft:#163a2d;
  --out:#f08a55; --out-soft:#3a2117;
  --warn:#e8b34a; --warn-soft:#3a2e14;
  --empty:#f2766b; --empty-soft:#3d1a17;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-family:var(--mono);font-size:2rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.date{font-size:1rem;font-weight:600}
.date small{display:block;color:var(--muted);font-weight:400;font-size:.85rem}
.hbtns{display:flex;align-items:center;gap:8px}
.share{background:var(--surface);border:1.5px solid var(--accent);color:var(--accent);border-radius:99px;padding:8px 14px;font-weight:600;font-size:.9rem}
.ro{font-size:.8rem;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);padding:3px 10px;border-radius:99px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:10px;min-width:0}
.tile .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.letter{font-family:var(--mono);font-size:2.4rem;font-weight:700;line-height:1}
.plus{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-size:1.4rem;font-weight:600;line-height:1;flex:none}
.stock .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stock .n{font-size:2.2rem;font-weight:700;line-height:1.05}
.bar{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.tile.low .stock .n{color:var(--warn)} .tile.low .bar i{background:var(--warn)}
.tile.zero .stock .n{color:var(--empty)} .tile.zero .bar i{background:var(--empty)}
.tag{display:inline-block;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:99px;margin-inline-start:6px;vertical-align:middle}
.tag.low{background:var(--warn-soft);color:var(--warn)} .tag.zero{background:var(--empty-soft);color:var(--empty)}
.outbox{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.outbox label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--out);font-weight:600}
.outbox input{width:100%;min-width:0;font-size:1.5rem;font-weight:700;text-align:center;color:var(--out);
  background:var(--out-soft);border:1.5px solid transparent;border-radius:10px;padding:6px}
.outbox input:focus{border-color:var(--out);outline:none}
.outbox .err{font-size:.75rem;color:var(--empty);min-height:1em}
.saved{position:absolute;inset-inline-end:12px;bottom:12px;font-size:.7rem;color:var(--accent);font-weight:600}

table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:.95rem}
th,td{padding:10px 12px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;background:var(--surface-2);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.item{font-family:var(--mono);font-weight:700}
td.o{color:var(--out);font-weight:600}
td.b{font-weight:700}
tfoot td{font-weight:700;background:var(--surface-2)}
h3{margin:0 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.log{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:.92rem}
.row:first-child{border-top:0}
.row .what{flex:1;min-width:0}
.row .t{color:var(--muted);font-size:.8rem}
.q{font-weight:700;min-width:52px;text-align:center;border-radius:8px;padding:2px 6px;color:var(--accent);background:var(--accent-soft)}
.undo{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.none{padding:12px;color:var(--muted);font-size:.9rem}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.88rem}
.empty{grid-column:1/-1;background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:24px;text-align:center;color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:20}
.sheet{position:fixed;inset-inline:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;
  max-height:90%;overflow:auto;padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.grip{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-head h2{margin:0;font-size:1.25rem}
.x{background:var(--surface-2);border:0;border-radius:99px;width:36px;height:36px;font-size:1.2rem;flex:none}
.stepper{display:flex;align-items:stretch;gap:8px}
.stepper button{width:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:1.5rem;font-weight:600}
.stepper input{flex:1;min-width:0;text-align:center;font-size:1.8rem;font-weight:700;border:1.5px solid var(--line);border-radius:12px;padding:8px;background:var(--surface)}
.btns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:1.05rem}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.err{color:var(--empty);font-size:.88rem;min-height:1.2em;text-align:center}
.hint{font-size:.85rem;color:var(--muted);text-align:center}
.shot{width:100%;border-radius:12px;border:1px solid var(--line);display:block;-webkit-touch-callout:default}
.view{display:flex;flex-direction:column;gap:16px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:8px;background:var(--surface);border-top:1px solid var(--line);
  padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));justify-content:center}
.tab{flex:1;max-width:260px;border:0;border-radius:12px;padding:12px;font-weight:600;font-size:1rem;background:var(--surface-2);color:var(--muted)}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-fg)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mnav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.6rem;line-height:1;flex:none}
.mnav:disabled{opacity:.35}
.mtitle{text-align:center;min-width:0}
.mtitle b{display:block;font-size:1.25rem}
.mtitle small{color:var(--out);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.mscroll{overflow-x:auto;border-radius:14px}
.mtable{font-size:.95rem}
.mtable th,.mtable td{text-align:center;padding:8px 10px}
.mtable th:first-child,.mtable td:first-child{text-align:left;white-space:nowrap}
.mtable thead th{position:sticky;top:0}
.mtable thead th:not(:first-child){font-family:var(--mono);font-size:1rem;color:var(--fg);letter-spacing:0;text-transform:none}
.mtable td.d{color:var(--muted)}
.mtable td.d b{color:var(--fg);font-weight:600;display:inline-block;min-width:1.6em}
.mtable td.v{color:var(--out);font-weight:600}
.mtable td.z{color:var(--line)}
.mtable tr.fri td{background:var(--surface-2)}
.mtable tr.now td{background:var(--out-soft)}
.mtable tr.now td.d b{color:var(--out)}
.mtable tr.future td{color:var(--line)}
.mtable tfoot td{color:var(--fg)}
.mtable tfoot td.v{color:var(--out)}
.mnote{margin:0;font-size:.82rem;color:var(--muted);text-align:center}
.toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:360px;z-index:30;
  background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;text-align:center;font-size:.95rem}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Alf3</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="hbtns">
      <span class="ro" id="ro" hidden>View only</span>
      <button class="share" id="shareBtn" hidden>Share image</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="view" id="viewToday">
  <div class="grid" id="grid">
    <div class="empty">Loading stock…</div>
  </div>

  <section>
    <h3>Today's summary</h3>
    <table>
      <thead><tr><th>Item</th><th>Stock in</th><th>Discharge</th><th>Remaining</th></tr></thead>
      <tbody id="tbody"></tbody>
      <tfoot><tr><td>Total</td><td class="num" id="fIn">0</td><td class="num o" id="fOut">0</td><td class="num b" id="fBal">0</td></tr></tfoot>
    </table>
  </section>

  <section>
    <h3>Stock added today</h3>
    <div class="log" id="inLog"><div class="none">Nothing added today.</div></div>
  </section>
  </div>

  <div class="view" id="viewMonth" hidden>
    <div class="mhead">
      <button class="mnav" id="mPrev" aria-label="Previous month">‹</button>
      <div class="mtitle"><b id="mName"></b><small>Discharge per day</small></div>
      <button class="mnav" id="mNext" aria-label="Next month">›</button>
    </div>
    <div class="mscroll">
      <table class="mtable">
        <thead><tr id="mHeadRow"><th>Date</th></tr></thead>
        <tbody id="mBody"></tbody>
        <tfoot><tr id="mFoot"></tr></tfoot>
      </table>
    </div>
    <p class="mnote">Filled in automatically from the daily Discharge entries.</p>
  </div>
</div>

<nav class="tabs" aria-label="Pages">
  <button class="tab" data-view="today" aria-current="page">Today</button>
  <button class="tab" data-view="month">Monthly</button>
</nav>

<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const state = { items: [], ins: [], outs: [], canWrite: true, db: null, ready:{items:false,ins:false,outs:false}, built:'' };
  const fmt = n => Number(n||0).toLocaleString('en-US');
  const pad = n => String(n).padStart(2,'0');
  const dayKey = (d=new Date()) => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const timeOf = ms => { const d=new Date(ms); return pad(d.getHours())+':'+pad(d.getMinutes()); };

  let today = dayKey();
  function paintDate(){
    const d=new Date();
    $('#date').innerHTML = esc(d.toLocaleDateString('en-GB',{weekday:'long'}))+
      '<small>'+esc(d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}))+'</small>';
  }
  paintDate();
  setInterval(()=>{ const k=dayKey(); if(k!==today){ today=k; paintDate(); state.built=''; render(); } }, 30000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ const k=dayKey(); if(k!==today){ today=k; paintDate(); state.built=''; render(); } } });

  let toastT;
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true, 2200); }

  function stats(id){
    let inn=0,out=0,todayOut=0,todayIn=0;
    for(const m of state.ins){ if(m.itemId!==id) continue; inn+=m.qty; if(m.date===today) todayIn+=m.qty; }
    for(const o of state.outs){ if(o.itemId!==id) continue; out+=o.qty; if(o.date===today) todayOut+=o.qty; }
    return {inn,out,bal:inn-out,todayOut,todayIn};
  }
  const sorted = () => [...state.items].sort((a,b)=>(a.order||0)-(b.order||0));

  function buildGrid(items){
    $('#grid').innerHTML = items.map(it=>
      '<div class="tile" data-id="'+esc(it.id)+'">'+
        '<div class="top"><span class="letter">'+esc(it.name)+'<span class="tagslot"></span></span>'+
        (state.canWrite?'<button class="plus" data-plus="'+esc(it.id)+'" aria-label="Add stock to '+esc(it.name)+'">+</button>':'')+'</div>'+
        '<div class="stock"><div class="k">In stock</div><div class="n num"></div></div>'+
        '<div class="bar"><i></i></div>'+
        '<div class="outbox"><label for="out-'+esc(it.id)+'">Discharge</label>'+
        '<input id="out-'+esc(it.id)+'" class="num" type="number" inputmode="numeric" min="0" step="1" data-out="'+esc(it.id)+'"'+(state.canWrite?'':' readonly')+'>'+
        '<span class="err"></span></div>'+
      '</div>').join('');
  }

  function render(){
    if(!(state.ready.items && state.ready.ins && state.ready.outs)) return;
    const items=sorted();
    if(!items.length){ $('#grid').innerHTML='<div class="empty">No items yet.</div>'; state.built=''; }
    else {
      const sig=items.map(i=>i.id+':'+i.name).join('|')+'|'+state.canWrite+'|'+today;
      if(sig!==state.built){ buildGrid(items); state.built=sig; }
    }
    let tIn=0,tOut=0,tBal=0; const rows=[];
    for(const it of items){
      const s=stats(it.id); tIn+=s.inn; tOut+=s.todayOut; tBal+=s.bal;
      const pct = s.inn>0 ? Math.max(0,Math.min(100, s.bal/s.inn*100)) : 0;
      const cls = s.bal<=0 ? 'zero' : (pct<=20 ? 'low' : '');
      const tile=document.querySelector('.tile[data-id="'+CSS.escape(it.id)+'"]');
      if(tile){
        tile.className='tile '+cls;
        tile.querySelector('.stock .n').textContent=fmt(s.bal);
        tile.querySelector('.bar i').style.width=pct+'%';
        tile.querySelector('.tagslot').innerHTML = cls==='zero'?'<span class="tag zero">Out</span>':cls==='low'?'<span class="tag low">Low</span>':'';
        const inp=tile.querySelector('input');
        if(document.activeElement!==inp) inp.value = s.todayOut ? s.todayOut : '';
        inp.placeholder='0';
      }
      rows.push('<tr><td class="item">'+esc(it.name)+'</td><td class="num">'+fmt(s.inn)+'</td><td class="num o">'+fmt(s.todayOut)+'</td><td class="num b">'+fmt(s.bal)+'</td></tr>');
    }
    $('#tbody').innerHTML=rows.join('');
    $('#fIn').textContent=fmt(tIn); $('#fOut').textContent=fmt(tOut); $('#fBal').textContent=fmt(tBal);
    $('#shareBtn').hidden=!items.length;

    const names=Object.fromEntries(state.items.map(i=>[i.id,i.name]));
    const added=state.ins.filter(m=>m.date===today && names[m.itemId]!==undefined).sort((a,b)=>b.at-a.at);
    $('#inLog').innerHTML = added.length ? added.map(m=>
      '<div class="row"><span class="q num">+'+fmt(m.qty)+'</span><span class="what"><b>'+esc(names[m.itemId])+'</b><div class="t num">'+timeOf(m.at)+'</div></span>'+
      (state.canWrite?'<button class="undo" data-undo="'+esc(m.id)+'">Undo</button>':'')+'</div>').join('')
      : '<div class="none">Nothing added today.</div>';
    renderMonth();
  }

  // ---------- writes ----------
  let busy=false;
  async function guard(fn){
    if(busy) return false; busy=true;
    try{ await fn(); return true; }
    catch(e){
      const code=e&&e.code;
      if(code==='invalid_argument'){ state.canWrite=false; applyWrite(); state.built=''; render(); toast('You can only view this'); }
      else if(code==='quota_exceeded') toast('Storage is full');
      else toast('Not saved. Try again.');
      return false;
    } finally { busy=false; }
  }

  async function saveOut(id, inp){
    const tile=inp.closest('.tile'); const err=tile.querySelector('.outbox .err'); err.textContent='';
    const raw=inp.value.trim(); const qty = raw==='' ? 0 : parseInt(raw,10);
    const s=stats(id);
    if(!(qty>=0) || String(qty)!==String(parseInt(raw||'0',10))){ err.textContent='Whole number only'; return; }
    if(qty===s.todayOut) return;
    const maxToday = s.bal + s.todayOut;
    if(qty>maxToday){ err.textContent='Only '+fmt(maxToday)+' available'; inp.value=s.todayOut||''; return; }
    const ref=state.db.doc('outs/'+id+'_'+today);
    const ok=await guard(async()=>{ if(qty===0) await ref.delete(); else await ref.set({itemId:id, date:today, qty, at:Date.now()}); });
    if(ok){ const it=state.items.find(i=>i.id===id); toast(it.name+': discharge '+fmt(qty)+' · left '+fmt(maxToday-qty)); }
  }

  document.addEventListener('change', e=>{ const inp=e.target.closest('[data-out]'); if(inp && state.canWrite) saveOut(inp.dataset.out, inp); });
  document.addEventListener('keydown', e=>{
    const inp=e.target.closest && e.target.closest('[data-out]');
    if(inp && e.key==='Enter'){ inp.blur(); }
    if(e.key==='Escape') closeSheet();
    if(e.key==='Enter' && e.target.id==='qty'){ const b=document.querySelector('[data-addok]'); b && b.click(); }
  });

  // ---------- sheets ----------
  function closeSheet(){ $('#sheetRoot').innerHTML=''; }
  function shell(inner){
    $('#sheetRoot').innerHTML='<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>'+inner+'</div>';
  }
  function openPlus(id){
    const it=state.items.find(i=>i.id===id); if(!it) return; const s=stats(id);
    shell('<div class="sh-head"><h2>Add stock · '+esc(it.name)+'</h2><button class="x" data-close aria-label="Close">×</button></div>'+
      '<div class="hint">In stock now: <b class="num">'+fmt(s.bal)+'</b></div>'+
      '<div class="stepper"><button data-step="-1" aria-label="Less">−</button><input id="qty" class="num" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="Quantity"><button data-step="1" aria-label="More">+</button></div>'+
      '<div class="err" id="err"></div>'+
      '<button class="btn primary" data-addok="'+esc(id)+'">Add to stock</button>');
    setTimeout(()=>{ const q=$('#qty'); q && (q.focus(), q.select()); }, 60);
  }

  // ---------- share as image ----------
  async function buildImage(){
    try{ await Promise.all([document.fonts.load('700 40px "IBM Plex Sans"'),document.fonts.load('600 40px "IBM Plex Sans"'),document.fonts.load('700 40px "IBM Plex Mono"')]); }catch(_){}
    const K={bg:'#eef2f0',sf:'#ffffff',s2:'#f4f7f5',ln:'#d9e2dd',fg:'#15201b',mu:'#5d6b64',ac:'#0d7556',acs:'#dcefe7',out:'#b8430f',outs:'#fbe6da',wa:'#a86b00',was:'#fbefd2',em:'#b42318',ems:'#fbe0dd'};
    const F='"IBM Plex Sans", Arial, sans-serif', M='"IBM Plex Mono", Menlo, monospace';
    const rows=sorted().map(it=>({name:it.name,...stats(it.id)}));
    const names=Object.fromEntries(state.items.map(i=>[i.id,i.name]));
    const added=state.ins.filter(m=>m.date===today && names[m.itemId]!==undefined).sort((a,b)=>b.at-a.at);
    const W=1080, P=60, G=30, tw=(W-2*P-G)/2, th=500;
    const tileRows=Math.ceil(rows.length/2);
    const yTiles=300, ySum=yTiles+tileRows*(th+G)+40;
    const tableH=70+rows.length*80+80;
    const yLog=ySum+60+tableH+60;
    const logH=Math.max(1,added.length)*90;
    const H=yLog+60+logH+70;
    const c=document.createElement('canvas'); c.width=W; c.height=H;
    const x=c.getContext('2d');
    const T=(s,X,Y,font,col,al)=>{ x.font=font; x.fillStyle=col; x.textAlign=al||'left'; x.fillText(s,X,Y); };
    x.fillStyle=K.bg; x.fillRect(0,0,W,H);
    x.textBaseline='alphabetic';
    const d=new Date();
    T('Alf3',P,130,'700 92px '+M,K.fg);
    T(d.toLocaleDateString('en-GB',{weekday:'long'}),P,195,'700 40px '+F,K.fg);
    T(d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),P,245,'400 32px '+F,K.mu);
    T('Updated '+pad(d.getHours())+':'+pad(d.getMinutes()),W-P,130,'600 30px '+F,K.mu,'right');
    // tiles
    rows.forEach((r,i)=>{
      const tx=P+(i%2)*(tw+G), ty=yTiles+Math.floor(i/2)*(th+G);
      const pct=r.inn>0?Math.max(0,Math.min(1,r.bal/r.inn)):0;
      const col=r.bal<=0?K.em:pct<=.2?K.wa:K.fg, barc=r.bal<=0?K.em:pct<=.2?K.wa:K.ac;
      x.fillStyle=K.sf; rr(x,tx,ty,tw,th,40); x.fill(); x.strokeStyle=K.ln; x.lineWidth=2; x.stroke();
      T(r.name,tx+36,ty+115,'700 100px '+M,K.fg);
      const flag=r.bal<=0?'OUT':pct<=.2?'LOW':'';
      if(flag){ x.font='700 34px '+F; const lw=x.measureText(r.name).width; x.font='700 100px '+M; const nw=x.measureText(r.name).width;
        const px=tx+36+nw+16, fw=(x.font='700 24px '+F, x.measureText(flag).width+28);
        x.fillStyle=r.bal<=0?K.ems:K.was; rr(x,px,ty+62,fw,40,20); x.fill(); T(flag,px+fw/2,ty+90,'700 24px '+F,r.bal<=0?K.em:K.wa,'center'); }
      T('IN STOCK',tx+36,ty+180,'600 26px '+F,K.mu);
      T(fmt(r.bal),tx+36,ty+268,'700 88px '+F,col);
      x.fillStyle=K.s2; rr(x,tx+36,ty+292,tw-72,12,6); x.fill();
      if(pct>0){ x.fillStyle=barc; rr(x,tx+36,ty+292,Math.max(12,(tw-72)*pct),12,6); x.fill(); }
      x.setLineDash([8,8]); x.strokeStyle=K.ln; x.beginPath(); x.moveTo(tx+36,ty+334); x.lineTo(tx+tw-36,ty+334); x.stroke(); x.setLineDash([]);
      T('DISCHARGE',tx+36,ty+376,'600 26px '+F,K.out);
      x.fillStyle=K.outs; rr(x,tx+36,ty+394,tw-72,80,20); x.fill();
      T(fmt(r.todayOut),tx+tw/2,ty+452,'700 50px '+F,K.out,'center');
    });
    // summary table
    T("TODAY'S SUMMARY",P,ySum+30,'600 26px '+F,K.mu);
    const ty0=ySum+60, cw=W-2*P, cIn=P+cw*0.48, cDis=P+cw*0.74, cRem=P+cw-36;
    x.save(); rr(x,P,ty0,cw,tableH,30); x.fillStyle=K.sf; x.fill(); x.clip();
    x.fillStyle=K.s2; x.fillRect(P,ty0,cw,70); x.fillRect(P,ty0+tableH-80,cw,80);
    x.fillStyle=K.ln; for(let k=0;k<=rows.length;k++){ x.fillRect(P,ty0+70+k*80-1,cw,2); }
    x.restore(); x.strokeStyle=K.ln; x.lineWidth=2; rr(x,P,ty0,cw,tableH,30); x.stroke();
    ['ITEM','STOCK IN','DISCHARGE','REMAINING'].forEach((h,j)=>T(h,[P+36,cIn,cDis,cRem][j],ty0+45,'600 24px '+F,K.mu,j?'right':'left'));
    let tI=0,tD=0,tB=0;
    rows.forEach((r,k)=>{ const yy=ty0+70+k*80+52; tI+=r.inn; tD+=r.todayOut; tB+=r.bal;
      T(r.name,P+36,yy,'700 34px '+M,K.fg); T(fmt(r.inn),cIn,yy,'400 32px '+F,K.fg,'right');
      T(fmt(r.todayOut),cDis,yy,'600 32px '+F,K.out,'right'); T(fmt(r.bal),cRem,yy,'700 32px '+F,K.fg,'right'); });
    const fy=ty0+tableH-28;
    T('Total',P+36,fy,'700 32px '+F,K.fg); T(fmt(tI),cIn,fy,'700 32px '+F,K.fg,'right');
    T(fmt(tD),cDis,fy,'700 32px '+F,K.out,'right'); T(fmt(tB),cRem,fy,'700 32px '+F,K.fg,'right');
    // stock added today
    T('STOCK ADDED TODAY',P,yLog+30,'600 26px '+F,K.mu);
    const ly=yLog+60;
    x.fillStyle=K.sf; rr(x,P,ly,cw,logH,30); x.fill(); x.strokeStyle=K.ln; x.lineWidth=2; x.stroke();
    if(!added.length) T('Nothing added today.',P+36,ly+56,'400 30px '+F,K.mu);
    added.forEach((m,k)=>{ const yy=ly+k*90;
      if(k){ x.fillStyle=K.ln; x.fillRect(P,yy-1,cw,2); }
      x.fillStyle=K.acs; rr(x,P+30,yy+20,130,50,14); x.fill();
      T('+'+fmt(m.qty),P+95,yy+56,'700 30px '+F,K.ac,'center');
      T(names[m.itemId],P+190,yy+56,'700 32px '+M,K.fg);
      T(timeOf(m.at),P+cw-36,yy+56,'400 28px '+F,K.mu,'right'); });
    return c;
  }
  function rr(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }
  function shareText(){
    const d=new Date();
    if(view==='month'){ const {mi,items,rows,tot}=monthData();
      return 'Alf3 · '+mi.name+' · Discharge\nDate | '+items.map(i=>i.name).join(' | ')+'\n'+
        rows.filter(r=>!r.future).map(r=>pad(r.d)+' '+r.wd+' | '+r.vals.map(fmt).join(' | ')).join('\n')+
        '\nTotal | '+tot.map(fmt).join(' | '); }
    return 'Alf3 · '+d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+'\n'+
      sorted().map(it=>{const s=stats(it.id); return it.name+': discharge '+fmt(s.todayOut)+' · remaining '+fmt(s.bal);}).join('\n');
  }
  let shotBlob=null;
  // ---------- monthly view ----------
  let view='today', mOff=0;
  function monthInfo(){
    const n=new Date(); const d=new Date(n.getFullYear(), n.getMonth()+mOff, 1);
    return {y:d.getFullYear(), m:d.getMonth(), days:new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(),
      name:d.toLocaleDateString('en-GB',{month:'long',year:'numeric'})};
  }
  function monthData(){
    const mi=monthInfo(), items=sorted(), map={};
    for(const o of state.outs) map[o.itemId+'|'+o.date]=o.qty;
    const tot=items.map(()=>0), rows=[];
    for(let d=1; d<=mi.days; d++){
      const key=mi.y+'-'+pad(mi.m+1)+'-'+pad(d), dt=new Date(mi.y, mi.m, d);
      const vals=items.map((it,j)=>{ const v=map[it.id+'|'+key]||0; tot[j]+=v; return v; });
      rows.push({d, key, wd:dt.toLocaleDateString('en-GB',{weekday:'short'}), dow:dt.getDay(), vals, future:key>today, now:key===today});
    }
    return {mi, items, rows, tot};
  }
  function renderMonth(){
    if(!(state.ready.items && state.ready.outs)) return;
    const {mi,items,rows,tot}=monthData();
    $('#mName').textContent=mi.name; $('#mNext').disabled = mOff>=0;
    $('#mHeadRow').innerHTML='<th>Date</th>'+items.map(i=>'<th>'+esc(i.name)+'</th>').join('');
    $('#mBody').innerHTML=rows.map(r=>{
      const cls=r.now?'now':r.future?'future':(r.dow===5||r.dow===6)?'fri':'';
      return '<tr class="'+cls+'"><td class="d"><b class="num">'+pad(r.d)+'</b> '+r.wd+'</td>'+
        r.vals.map(v=> r.future ? '<td class="z">·</td>' : v ? '<td class="num v">'+fmt(v)+'</td>' : '<td class="num z">0</td>').join('')+'</tr>';
    }).join('');
    $('#mFoot').innerHTML='<td>Total</td>'+tot.map(v=>'<td class="num v">'+fmt(v)+'</td>').join('');
  }
  function setView(v){
    view=v;
    $('#viewToday').hidden = v!=='today'; $('#viewMonth').hidden = v!=='month';
    document.querySelectorAll('.tab').forEach(b=>{ if(b.dataset.view===v) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
    try{ localStorage.setItem('alf3-view', v); }catch(_){}
    if(v==='month') renderMonth();
    window.scrollTo(0,0);
  }
  try{ const sv=localStorage.getItem('alf3-view'); if(sv==='month') setView('month'); }catch(_){}

  async function buildMonthImage(){
    try{ await Promise.all([document.fonts.load('700 40px "IBM Plex Sans"'),document.fonts.load('600 40px "IBM Plex Sans"'),document.fonts.load('700 40px "IBM Plex Mono"')]); }catch(_){}
    const K={bg:'#eef2f0',sf:'#ffffff',s2:'#f4f7f5',ln:'#d9e2dd',fg:'#15201b',mu:'#5d6b64',out:'#b8430f',outs:'#fbe6da',fade:'#b9c6c0'};
    const F='"IBM Plex Sans", Arial, sans-serif', M='"IBM Plex Mono", Menlo, monospace';
    const {mi,items,rows,tot}=monthData();
    const W=1080, P=60, cw=W-2*P, y0=300, hh=72, rh=56, fh=80;
    const H=y0+hh+rows.length*rh+fh+70;
    const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
    const T=(s,X,Y,font,col,al)=>{ x.font=font; x.fillStyle=col; x.textAlign=al||'left'; x.fillText(s,X,Y); };
    x.fillStyle=K.bg; x.fillRect(0,0,W,H); x.textBaseline='alphabetic';
    const d=new Date();
    T('Alf3',P,130,'700 92px '+M,K.fg);
    T(mi.name,P,200,'700 44px '+F,K.fg);
    T('DISCHARGE PER DAY',P,248,'600 26px '+F,K.out);
    T('Updated '+d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' · '+pad(d.getHours())+':'+pad(d.getMinutes()),W-P,130,'600 28px '+F,K.mu,'right');
    const colW=(cw-300)/Math.max(1,items.length), cx=j=>P+300+colW*(j+.5);
    const tH=hh+rows.length*rh+fh;
    x.save(); rr(x,P,y0,cw,tH,30); x.fillStyle=K.sf; x.fill(); x.clip();
    x.fillStyle=K.s2; x.fillRect(P,y0,cw,hh); x.fillRect(P,y0+tH-fh,cw,fh);
    rows.forEach((r,k)=>{ const ry=y0+hh+k*rh;
      if(r.now){ x.fillStyle=K.outs; x.fillRect(P,ry,cw,rh); }
      else if(!r.future && (r.dow===5||r.dow===6)){ x.fillStyle=K.s2; x.fillRect(P,ry,cw,rh); }
      x.fillStyle=K.ln; x.fillRect(P,ry-1,cw,1.5); });
    x.fillStyle=K.ln; x.fillRect(P,y0+tH-fh-1,cw,2);
    x.restore(); x.strokeStyle=K.ln; x.lineWidth=2; rr(x,P,y0,cw,tH,30); x.stroke();
    T('DATE',P+32,y0+46,'600 24px '+F,K.mu);
    items.forEach((it,j)=>T(it.name,cx(j),y0+48,'700 34px '+M,K.fg,'center'));
    rows.forEach((r,k)=>{ const by=y0+hh+k*rh+38;
      const dc=r.future?K.fade:K.fg;
      T(pad(r.d),P+32,by,'600 28px '+F,r.now?K.out:dc);
      T(r.wd,P+84,by,'400 26px '+F,r.future?K.fade:K.mu);
      r.vals.forEach((v,j)=>{
        if(r.future) T('·',cx(j),by,'400 28px '+F,K.fade,'center');
        else T(fmt(v),cx(j),by,(v?'700':'400')+' 28px '+F,v?K.out:K.fade,'center'); });
    });
    const fy=y0+tH-28;
    T('Total',P+32,fy,'700 32px '+F,K.fg);
    tot.forEach((v,j)=>T(fmt(v),cx(j),fy,'700 32px '+F,K.out,'center'));
    return c;
  }

  async function openShare(){
    shell('<div class="sh-head"><h2>Share image</h2><button class="x" data-close aria-label="Close">×</button></div><div class="hint">Preparing image…</div>');
    const c = view==='month' ? await buildMonthImage() : await buildImage();
    shotBlob=await new Promise(r=>c.toBlob(r,'image/png'));
    shell('<div class="sh-head"><h2>Share image</h2><button class="x" data-close aria-label="Close">×</button></div>'+
      '<img class="shot" src="'+c.toDataURL('image/png')+'" alt="'+(view==='month'?'Alf3 monthly discharge':'Alf3 full page')+'">'+
      '<div class="hint">Press and hold the image to save or share it on WhatsApp.</div>'+
      '<div class="btns"><button class="btn primary" data-saveimg>Save image</button><button class="btn ghost" data-copytxt>Copy as text</button></div>'+
      '<div class="err" id="err"></div>');
  }

  document.addEventListener('click', e=>{
    const t=e.target;
    if(t.closest('[data-close]')){ closeSheet(); return; }
    if(t.closest('#shareBtn')){ openShare(); return; }
    const tab=t.closest('.tab'); if(tab){ setView(tab.dataset.view); return; }
    if(t.closest('#mPrev')){ mOff--; renderMonth(); return; }
    if(t.closest('#mNext')){ if(mOff<0){ mOff++; renderMonth(); } return; }
    const plus=t.closest('[data-plus]'); if(plus){ openPlus(plus.dataset.plus); return; }
    const step=t.closest('[data-step]');
    if(step){ const q=$('#qty'); q.value=Math.max(1,(parseInt(q.value,10)||0)+Number(step.dataset.step)); $('#err').textContent=''; return; }
    const ok=t.closest('[data-addok]');
    if(ok){
      const qty=parseInt($('#qty').value,10);
      if(!(qty>0)){ $('#err').textContent='Enter a number above 0'; return; }
      const id=ok.dataset.addok; const it=state.items.find(i=>i.id===id);
      guard(async()=>{ await state.db.collection('ins').add({itemId:id, qty, date:today, at:Date.now()}); toast('Added '+fmt(qty)+' to '+it.name); closeSheet(); });
      return;
    }
    const undo=t.closest('[data-undo]');
    if(undo){ guard(async()=>{ await state.db.doc('ins/'+undo.dataset.undo).delete(); toast('Undone'); }); return; }
    if(t.closest('[data-saveimg]')){
      (async()=>{
        const dl = window.claude ? await window.claude.use('downloads') : null;
        if(!dl || !shotBlob){ $('#err').textContent='Saving is not available here. Press and hold the image instead.'; return; }
        try{ await dl.save({filename:(view==='month'?'Alf3-'+monthInfo().y+'-'+pad(monthInfo().m+1)+'-monthly':'Alf3-'+today)+'.png', data:shotBlob}); toast('Image saved'); }
        catch(err){ if(!err||err.code!=='declined') $('#err').textContent='Not saved. Press and hold the image instead.'; }
      })();
      return;
    }
    if(t.closest('[data-copytxt]')){
      navigator.clipboard.writeText(shareText()).then(()=>toast('Copied. Paste it in WhatsApp.'), ()=>{ $('#err').textContent='Could not copy'; });
    }
  });

  function applyWrite(){ $('#ro').hidden=state.canWrite; }

  // ---------- boot ----------
  async function boot(){
    const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if(!db){ $('#grid').innerHTML='<div class="empty"><b>Sign in to see the stock.</b><br>The numbers are saved to your claude.ai account.</div>'; return; }
    state.db=db;
    try{ const user=await window.claude.use('user'); if(user){ const c=await user.can('data.write'); if(c===false) state.canWrite=false; } }catch(_){}
    applyWrite();
    const banner=$('#banner');
    const timer=setTimeout(()=>{ banner.textContent='Slow connection. Numbers may be out of date.'; banner.hidden=false; }, 10000);
    const settle=snap=>{ if(!snap.metadata.fromCache){ clearTimeout(timer); banner.hidden=true; } };
    const onErr=()=>{ clearTimeout(timer); banner.textContent='Could not load the data. Reopen the page.'; banner.hidden=false; };
    db.collection('items').onSnapshot(s=>{ state.items=s.docs.map(d=>({id:d.id,...d.data()})); state.ready.items=true; settle(s); render(); }, onErr);
    db.collection('ins').onSnapshot(s=>{ state.ins=s.docs.map(d=>{const x=d.data(); return {id:d.id,itemId:x.itemId,qty:Number(x.qty)||0,date:x.date,at:x.at||0};}); state.ready.ins=true; settle(s); render(); }, onErr);
    db.collection('outs').onSnapshot(s=>{ state.outs=s.docs.map(d=>{const x=d.data(); return {id:d.id,itemId:x.itemId,qty:Number(x.qty)||0,date:x.date};}); state.ready.outs=true; settle(s); render(); }, onErr);
  }
  boot();
})();
</script>
